const LS = {
  get(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}},

// ═══════════════════════════════════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function makeGroupState(gKey){
  const items={};
  (GROUPS[gKey]?.items||[]).forEach(id=>{items[id]={qty:0,checked:false,costOverride:null}});
  return {noAction:false,items,customItems:[],removedItems:[]};
}

function makeRoom(type,label){
  const groups={};
  ROOM_TYPES[type].groups.forEach(gKey=>{groups[gKey]=makeGroupState(gKey)});
  return {id:uid(),type,label,groups};
}

function makeProject(name,address=''){
  return {
    id:uid(), name, address,
    createdAt:Date.now(), updatedAt:Date.now(),
    rooms:[
      makeRoom('interior','Interior / General'),
      makeRoom('systems', 'Systems & Structure'),
      makeRoom('exterior','Exterior'),
      makeRoom('kitchen', 'Kitchen'),
      makeRoom('bathroom','Bathroom 1'),
    ],
    priceOverrides:{},
    photos:[],
    notes:'',
  };
}

function loadList()    {return LS.get('spark_projects',[])}
function saveList(l)   {LS.set('spark_projects',l)}
function loadProj(id)  {return LS.get(`spark_proj_${id}`,null)}
function saveProj(p){
  p.updatedAt=Date.now();
  LS.set(`spark_proj_${p.id}`,p);
  const list=loadList();
  const i=list.findIndex(x=>x.id===p.id);
  const s={id:p.id,name:p.name,address:p.address,updatedAt:p.updatedAt};
  if(i>=0)list[i]=s; else list.unshift(s);
  saveList(list);
}
function deleteProj(id){
  LS.rm(`spark_proj_${id}`);
  saveList(loadList().filter(p=>p.id!==id));
  if(LS.get('spark_active')===id)LS.rm('spark_active');
}
function getActiveId() {return LS.get('spark_active',null)}
function setActiveId(id){LS.set('spark_active',id)}
function getGlobalPrices(){return LS.get('spark_gprices',{})}
function setGlobalPrices(p){LS.set('spark_gprices',p)}

function effectiveCost(itemId,p,itemState){
  const gp=getGlobalPrices();
  return itemState?.costOverride??p.priceOverrides[itemId]??gp[itemId]??CATALOG[itemId]?.cost??0;
}

function computeTotal(p){
  let t=0;
  for(const room of p.rooms)
    for(const[,g]of Object.entries(room.groups)){
      if(g.noAction)continue;
      for(const[id,item]of Object.entries(g.items)){
        if(!item.checked||!item.qty||g.removedItems.includes(id))continue;
        t+=effectiveCost(id,p,item)*item.qty;
      }
      for(const ci of g.customItems){if(ci.checked&&ci.qty)t+=(ci.cost||0)*ci.qty}
    }
  return t;
}

function computeGroupSub(room,gKey){
  const g=room.groups[gKey];
  if(!g||g.noAction)return 0;
  let t=0;
  for(const[id,item]of Object.entries(g.items)){
    if(item.checked&&item.qty&&!g.removedItems.includes(id))
      t+=effectiveCost(id,proj,item)*item.qty;
  }
  for(const ci of g.customItems){if(ci.checked&&ci.qty)t+=(ci.cost||0)*ci.qty}
  return t;
}

function computeRoomSub(room){
  return Object.keys(room.groups).reduce((s,gKey)=>s+computeGroupSub(room,gKey),0);
}

// ── Phase 8: triage and comparison helpers ────────────────────────────────

function getTriageItems(p){
  const all=[];
  for(const room of p.rooms){
    for(const[gKey,g]of Object.entries(room.groups)){
      if(g.noAction)continue;
      for(const[id,item]of Object.entries(g.items)){
        if(!item.checked||!item.qty||g.removedItems.includes(id))continue;
        const cost=effectiveCost(id,p,item);
        const lt=cost*item.qty;
        if(lt>0)all.push({room:room.label,group:GROUPS[gKey]?.label||'',name:CATALOG[id].name,qty:item.qty,unit:CATALOG[id].unit,lt});
      }
      for(const ci of g.customItems){
        if(!ci.checked||!ci.qty)continue;
        const lt=(ci.cost||0)*ci.qty;
        if(lt>0)all.push({room:room.label,group:GROUPS[gKey]?.label||'',name:ci.name+' ✎',qty:ci.qty,unit:ci.unit||'ea.',lt});
      }
    }
  }
  all.sort((a,b)=>b.lt-a.lt);
  const total=all.reduce((s,i)=>s+i.lt,0);
  let run=0,cutoff=all.length-1;
  for(let i=0;i<all.length;i++){run+=all[i].lt;if(run>=total*0.80){cutoff=i;break;}}
  return{items:all,cutoff,total};
}

function getSectionCosts(p){
  const out={};
  for(const[type,rt]of Object.entries(ROOM_TYPES))out[type]={label:rt.label,total:0};
  for(const room of p.rooms)
    if(out[room.type])out[room.type].total+=computeRoomSub(room);
  return out;
}

// ── Phase 5: progress tracking ────────────────────────────────────────────

// A group is "reviewed" if noAction is set OR at least one item is checked.
function progressStats(p){
  let total=0,done=0;
  for(const room of p.rooms)
    for(const[,g]of Object.entries(room.groups)){
      total++;
      const anyItem=Object.entries(g.items).some(([id,i])=>i.checked&&!g.removedItems.includes(id));
      if(g.noAction||anyItem||g.customItems.some(c=>c.checked))done++;
    }
  return{pct:total?Math.round(done/total*100):0,done,total};
}

// ── Phase 3: room management ──────────────────────────────────────────────

function nextRoomNumber(type){
  const same=proj.rooms.filter(r=>r.type===type);
  if(!same.length)return 1;
  const nums=same.map(r=>{const m=r.label.match(/(\d+)$/);return m?parseInt(m[1]):0});
  return Math.max(...nums)+1;
}

function roomHasData(room){
  for(const g of Object.values(room.groups)){
    if(g.noAction)return true;
    if(Object.values(g.items).some(i=>i.checked||i.qty>0||i.costOverride!=null))return true;
    if(g.customItems.length>0)return true;
  }
  return false;
}

function addRoom(type){
  const rt=ROOM_TYPES[type];
  const n=nextRoomNumber(type);
  const label=rt.singleton?rt.label:`${rt.label} ${n}`;
  proj.rooms.push(makeRoom(type,label));
  saveProj(proj);render();
}

function removeRoom(roomId){
  proj.rooms=proj.rooms.filter(r=>r.id!==roomId);
  saveProj(proj);render();
}

function renameRoom(roomId,label){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(room){room.label=label;saveProj(proj);render();}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function showToast(msg,ms=2400){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');
    el.id='toast';
    el.className='fixed bottom-28 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg z-[70] pointer-events-none transition-opacity duration-300 whitespace-nowrap';

function patchLineTotal(roomId,gKey,itemId){
  const room=proj.rooms.find(r=>r.id===roomId);
  const item=room?.groups[gKey]?.items[itemId];
  if(!item)return;
  const lt=item.checked&&item.qty?effectiveCost(itemId,proj,item)*item.qty:0;
  const el=document.getElementById(`lt-${roomId}-${gKey}-${itemId}`);
  if(el)el.textContent=lt>0?fmt(lt):'';
}
function patchGroupSub(roomId,gKey){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const sub=computeGroupSub(room,gKey);
  const el=document.getElementById(`gsub-${roomId}-${gKey}`);
  if(el)el.textContent=sub>0?fmt(sub):'';
  const bar=document.getElementById(`gbar-${roomId}-${gKey}`);
  if(bar){const t=computeTotal(proj);bar.style.width=(t>0?Math.min(Math.round(sub/t*100),100):0)+'%';}
}
function patchRoomSub(roomId){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const sub=computeRoomSub(room);
  const el=document.getElementById(`rsub-${roomId}`);

function patchProgress(){

function handleCheck(roomId,gKey,itemId,checked){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const item=room.groups[gKey]?.items[itemId];
  if(!item)return;
  item.checked=checked;
  if(checked&&!item.qty){
    item.qty=1;
    const qEl=document.getElementById(`qty-${roomId}-${gKey}-${itemId}`);
    if(qEl&&!qEl.value)qEl.value='1';
  }
  saveProj(proj);
  const rowEl=document.getElementById(`irow-${roomId}-${gKey}-${itemId}`);
  if(rowEl)rowEl.classList.toggle('opacity-40',!checked);
  patchLineTotal(roomId,gKey,itemId);
  patchGroupSub(roomId,gKey);
  patchRoomSub(roomId);
  patchFooter();
  patchProgress();
}

function handleQtyInput(roomId,gKey,itemId,value){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const item=room.groups[gKey]?.items[itemId];
  if(!item)return;
  item.qty=parseFloat(value)||0;
  saveProj(proj);
  patchLineTotal(roomId,gKey,itemId);
  patchGroupSub(roomId,gKey);
  patchRoomSub(roomId);
  patchFooter();
}

function handleNoAction(roomId,gKey){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room||!room.groups[gKey])return;
  const g=room.groups[gKey];
  g.noAction=!g.noAction;
  saveProj(proj);
  const bodyEl=document.getElementById(`gb-${roomId}-${gKey}`);
  const btnEl =document.getElementById(`nab-${roomId}-${gKey}`);
  if(bodyEl)bodyEl.style.opacity=g.noAction?'0.35':'1';
  if(btnEl){
    btnEl.textContent=g.noAction?'✓ No Action':'No Action';
    btnEl.className=btnEl.className.replace(/\bna-(on|off)\b/g,'').trim()+(g.noAction?' na-on':' na-off');
  }
  patchGroupSub(roomId,gKey);
  patchRoomSub(roomId);
  patchFooter();
  patchProgress();
}

function handleToggleCollapse(roomId,gKey){
  const key=`${roomId}|${gKey}`;
  const bodyEl=document.getElementById(`gb-${roomId}-${gKey}`);
  const chevEl=document.getElementById(`chev-${roomId}-${gKey}`);
  if(collapsed.has(key)){
    collapsed.delete(key);
    bodyEl?.classList.remove('hidden');
    chevEl?.classList.remove('-rotate-90');
  }else{
    collapsed.add(key);
    bodyEl?.classList.add('hidden');
    chevEl?.classList.add('-rotate-90');
  }
}

// EXCEL WORKBOOK BUILDER — Phase 7
// ═══════════════════════════════════════════════════════════════════════════
function buildWorkbook(p){
  const rows=[], styleMap={};
  let ri=0;
  const R  =(...cols)=>{const i=ri++;rows.push(cols);return i;};
  const S  =(r,c,s)=>{(styleMap[r]??(styleMap[r]={}))[c]=s;};
  const enc=(r,c)=>XLSX.utils.encode_cell({r,c});
  const ORANGE='EA580C', WHITE='FFFFFF', DARK='1F2937',
        LORANGE='FFF7ED', GREEN='16A34A';
  const r0=R('Spark Homes — Repair Estimate','','','','','','');
  S(r0,0,{font:{bold:true,sz:16,color:{rgb:ORANGE}}});
  const r1=R(`Project: ${p.name}`,'','','','','','');
  S(r1,0,{font:{bold:true,sz:11}});
  if(p.address){ const ra=R(`Address: ${p.address}`,'','','','','',''); S(ra,0,{font:{sz:10,color:{rgb:'555555'}}}); }
  const dateStr=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const rd=R(`Date: ${dateStr}`,'','','','','',''); S(rd,0,{font:{sz:10,color:{rgb:'555555'}}});
  R();
  const hdrStyle=(col)=>({
    font:{bold:true,sz:10,color:{rgb:WHITE}},
    fill:{fgColor:{rgb:ORANGE},patternType:'solid'},
    alignment:{horizontal:col>=3?'right':'left',vertical:'center'},
  });
  const hRow=R('Room','Group','Item','Qty','Unit','Unit Cost','Line Total');
  for(let c=0;c<7;c++) S(hRow,c,hdrStyle(c));
  let grandTotal=0, lastRoom='';
  for(const room of p.rooms){
    let roomTotal=0, roomHasContent=false;
    for(const[gKey,g]of Object.entries(room.groups)){
      const gDef=GROUPS[gKey]; if(!gDef)continue;
      if(g.noAction){
        const r=R(room.label,gDef.label,'✓ No Action Needed','','','','');
        S(r,0,room.label!==lastRoom?{font:{bold:true}}:{});
        S(r,2,{font:{italic:true,color:{rgb:GREEN}}});
        lastRoom=room.label; roomHasContent=true; continue;
      }
      for(const[itemId,item]of Object.entries(g.items)){
        if(!item.checked||!item.qty||g.removedItems.includes(itemId))continue;
        const def=CATALOG[itemId];
        const cost=effectiveCost(itemId,p,item);
        const lt=cost*item.qty;
        const r=R(room.label,gDef.label,def.name,item.qty,def.unit,cost,lt);
        if(room.label!==lastRoom) S(r,0,{font:{bold:true}});
        S(r,3,{alignment:{horizontal:'right'}});
        S(r,5,{numFmt:'$#,##0.00',alignment:{horizontal:'right'},font:{sz:10}});
        S(r,6,{numFmt:'$#,##0.00',alignment:{horizontal:'right'},font:{bold:true,sz:10}});
        lastRoom=room.label; roomTotal+=lt; roomHasContent=true;
      }
      for(const ci of g.customItems){
        if(!ci.checked||!ci.qty)continue;
        const lt=(ci.cost||0)*ci.qty;
        const r=R(room.label,gDef.label,`${ci.name} (custom)`,ci.qty,ci.unit||'ea.',ci.cost||0,lt);
        S(r,5,{numFmt:'$#,##0.00',alignment:{horizontal:'right'}});
        S(r,6,{numFmt:'$#,##0.00',alignment:{horizontal:'right'},font:{bold:true}});
        lastRoom=room.label; roomTotal+=lt; roomHasContent=true;
      }
    }
    if(roomHasContent&&roomTotal>0){
      const sr=R('','','','','',`${room.label} Subtotal`,roomTotal);
      S(sr,5,{font:{bold:true},alignment:{horizontal:'right'},fill:{fgColor:{rgb:LORANGE},patternType:'solid'}});
      S(sr,6,{numFmt:'$#,##0.00',font:{bold:true},alignment:{horizontal:'right'},fill:{fgColor:{rgb:LORANGE},patternType:'solid'}});
    }
    if(roomHasContent) R();
    grandTotal+=roomTotal;
  }
  const snPhotos=p.photos.filter(ph=>ph.serialNumber);
  if(snPhotos.length){
    R();
    const sh=R('Serial Numbers Captured','','','','','','');
    S(sh,0,{font:{bold:true,sz:11,color:{rgb:ORANGE}}});
    for(const ph of snPhotos){
      const sr=R(ph.name,ph.serialNumber,'','','','','');
      S(sr,0,{font:{sz:10,color:{rgb:'555555'}}});
      S(sr,1,{font:{bold:true,sz:10,name:'Courier New'}});
    }
    R();
  }
  R();
  const gr=R('','','','','','GRAND TOTAL',grandTotal);
  S(gr,5,{font:{bold:true,sz:12,color:{rgb:WHITE}},fill:{fgColor:{rgb:DARK},patternType:'solid'},alignment:{horizontal:'right',vertical:'center'}});
  S(gr,6,{numFmt:'$#,##0.00',font:{bold:true,sz:12,color:{rgb:'F97316'}},fill:{fgColor:{rgb:DARK},patternType:'solid'},alignment:{horizontal:'right',vertical:'center'}});
  const ws=XLSX.utils.aoa_to_sheet(rows);
  for(const[rStr,cols]of Object.entries(styleMap)){
    for(const[cStr,s]of Object.entries(cols)){
      const a=enc(+rStr,+cStr);
      if(ws[a])ws[a].s=s;
    }
  }
  ws['!cols']=[{wch:22},{wch:22},{wch:40},{wch:8},{wch:18},{wch:14},{wch:14}];
  if(!ws['!merges'])ws['!merges']=[];
  ws['!merges'].push({s:{r:0,c:0},e:{r:0,c:6}});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Repair Estimate');
  return wb;
}

async function exportProject(){
  const btn=document.querySelector('[data-action="export"]');
  if(btn){btn.disabled=true;btn.textContent='Building…';}
  try{
    const wb=buildWorkbook(proj);
    const xlsxData=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const zip=new JSZip();
    zip.file('estimate.xlsx',xlsxData);
    if(proj.photos.length){
      const folder=zip.folder('photos');
      proj.photos.forEach((ph,i)=>{
        const n=String(i+1).padStart(3,'0');
        const snTag=ph.serialNumber?`-SN-${ph.serialNumber.replace(/[^\w-]/g,'_')}`:'';
        const b64=(ph.dataUrl||'').split(',')[1]||'';
        folder.file(`photo-${n}${snTag}.jpg`,b64,{base64:true});
      });
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const dateStr=new Date().toISOString().slice(0,10);
    const safeName=(proj.name||'estimate').replace(/[^\w\s-]/g,'').trim()
      .replace(/\s+/g,'-').toLowerCase().slice(0,40)||'estimate';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${safeName}-${dateStr}.zip`;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a);},1000);
    const photoLine=proj.photos.length?` + ${proj.photos.length} photo${proj.photos.length!==1?'s':''}`:' (no photos)';
    showToast(`Exported estimate.xlsx${photoLine}`);
  }catch(err){
    console.error('Export error:',err);
    showToast('Export failed — '+err.message,5000);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Export ZIP';}
  }
}

const LS_WARN_AT  = 4.2*1024*1024;
const LS_BLOCK_AT = 4.8*1024*1024;

function lsUsedChars(){
  let t=0;
  try{ for(const k of Object.keys(localStorage)) t+=(localStorage.getItem(k)||'').length; }
  catch{}
  return t;
}

function compressImage(file,maxPx=1024,quality=0.72){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){
          if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
          else{w=Math.round(w*maxPx/h);h=maxPx;}
        }
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function tryDetectBarcode(dataUrl){
  if(!('BarcodeDetector' in window))return null;
  try{
    const detector=new BarcodeDetector();
    const img=new Image();
    img.src=dataUrl;
    await new Promise(r=>{img.onload=r;img.onerror=r});
    const codes=await detector.detect(img);
    const sorted=codes.slice().sort((a,b)=>b.rawValue.length-a.rawValue.length);
    return sorted[0]?.rawValue||null;
  }catch{return null;}
}

async function handlePhotoFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  const dataUrl=await compressImage(file);
  const targetProj=proj;

  const used=lsUsedChars();
  const incoming=dataUrl.length;
  if(used+incoming>LS_BLOCK_AT){showToast('Storage full — remove photos to free space before adding more.',5000);return;}
  if(used+incoming>LS_WARN_AT){showToast(`Storage nearly full (${Math.round((used+incoming)/1024/1024*10)/10} MB used). Consider exporting and clearing photos.`,4000);}

  const photo={id:uid(),dataUrl,name:`Photo ${targetProj.photos.length+1}`,timestamp:Date.now(),serialNumber:null,scanning:true};
  targetProj.photos.push(photo);
  try{saveProj(targetProj);}
  catch(e){
    if(e.name==='QuotaExceededError'||e.message?.includes('quota')){
      targetProj.photos.pop();showToast('Storage full — photo not saved.',5000);return;
    }
    throw e;
  }
  if(proj===targetProj)patchPhotosSection();

  const sn=await tryDetectBarcode(dataUrl);
  const p=targetProj.photos.find(x=>x.id===photo.id);
  if(p){
    p.serialNumber=sn;p.scanning=false;saveProj(targetProj);
    if(proj===targetProj)patchPhotosSection();
  }
  if(sn)showToast(`Serial detected: ${sn}`);
}

function parseGlobalPriceCsv(text){
  const prices={};
  text.trim().split('\n').slice(1).forEach(line=>{
    const cols=line.split(',');
    const id=(cols[0]||'').trim().replace(/^"|"$/g,'');
    const cost=parseFloat((cols[2]||'').trim().replace(/^"|"$/g,''));
    if(id&&!isNaN(cost)&&CATALOG[id])prices[id]=cost;
  });
  return prices;
}

function buildPriceCsv(){
  const gp=getGlobalPrices();
  const rows=['id,name,cost,unit'];
  for(const[id,def]of Object.entries(CATALOG)){
    const cost=gp[id]??def.cost;
    rows.push(`${id},"${def.name.replace(/"/g,'""')}",${cost},"${def.unit}"`);
  }
  return rows.join('\n');
}

function priceBtn(roomId,gKey,itemId,cost,unit,hasOverride){
  const btn=document.createElement('button');
  btn.className='text-xs text-left active:opacity-60 leading-snug py-0.5';
  btn.dataset.editprice='';
  btn.dataset.room=roomId;
  btn.dataset.gkey=gKey;
  btn.dataset.item=itemId;
  btn.innerHTML=hasOverride
    ?`<span class="text-orange-500 font-medium">${fmtCost(cost)}</span><span class="text-orange-300 text-[10px] ml-0.5">✎</span> <span style="color:rgba(10,14,23,0.3)">/ ${esc(unit)}</span>`
    :`<span style="color:rgba(10,14,23,0.4)">${fmtCost(cost)}</span> <span style="color:rgba(10,14,23,0.25)">/ ${esc(unit)}</span>`;
  return btn;
}

function startPriceEdit(roomId,gKey,itemId,triggerEl){
  const room=proj.rooms.find(r=>r.id===roomId);
  const item=room?.groups[gKey]?.items[itemId];
  const def=CATALOG[itemId];
  if(!item||!def)return;
  const current=effectiveCost(itemId,proj,item);
  const inp=document.createElement('input');
  inp.type='number';inp.min='0';inp.step='0.01';inp.inputMode='decimal';
  inp.value=current;
  inp.className='text-orange-600 bg-orange-50 border border-orange-300 rounded-lg px-2 py-2 w-28 focus:outline-none focus:border-orange-500';
  triggerEl.replaceWith(inp);
  inp.focus();inp.select();
  const save=()=>{
    const v=parseFloat(inp.value);
    const base=effectiveCost(itemId,proj,{...item,costOverride:null});
    if(inp.value===''||isNaN(v)||v<0){item.costOverride=null;}
    else{item.costOverride=(Math.abs(v-base)<0.001)?null:v;}
    saveProj(proj);
    const newCost=effectiveCost(itemId,proj,item);
    const newBtn=priceBtn(roomId,gKey,itemId,newCost,def.unit,item.costOverride!=null);
    inp.replaceWith(newBtn);
    patchLineTotal(roomId,gKey,itemId);
    patchGroupSub(roomId,gKey);
    patchRoomSub(roomId);
    patchFooter();
    if(item.costOverride!=null)showToast(`Price set to ${fmtCost(item.costOverride)} for this room`);
    else if(inp.value!=='')showToast('Price reset to standard');
  };
  inp.addEventListener('blur',save,{once:true});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){
      inp.removeEventListener('blur',save);
      const restoredBtn=priceBtn(roomId,gKey,itemId,current,def.unit,item.costOverride!=null);
      inp.replaceWith(restoredBtn);
    }
  });
}

function openModal(mode,extra={}){
  modalSt={mode,...extra};
  document.getElementById('modal-box').innerHTML=renderModalContent(modalSt);
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>{
    const inp=document.getElementById('mf1');
    if(inp){inp.focus();inp.scrollIntoView({behavior:'smooth',block:'center'});}
  },80);
}
function closeModal(){
  document.getElementById('modal').classList.add('hidden');
  modalSt=null;
}
function confirmModal(){
  const{mode,roomId}=modalSt||{};
  if(mode==='new-proj'||mode==='rename-proj'){
    const name=document.getElementById('mf1')?.value.trim();
    if(!name){document.getElementById('mf1')?.focus();return;}
    const addr=document.getElementById('mf2')?.value.trim()||'';
    if(mode==='new-proj'){
      const p=makeProject(name,addr);saveProj(p);proj=p;setActiveId(p.id);
    }else{
      proj.name=name;proj.address=addr;saveProj(proj);
    }
    closeModal();render();
  }
  else if(mode==='rename-room'){
    const name=document.getElementById('mf1')?.value.trim();
    if(!name){document.getElementById('mf1')?.focus();return;}
    renameRoom(roomId,name);
    closeModal();
  }
  else if(mode==='remove-room'){
    removeRoom(roomId);
    closeModal();
  }
}

function renderItem(room,gKey,itemId){
  const item=room.groups[gKey].items[itemId];
  const def=CATALOG[itemId];
  if(!def||room.groups[gKey].removedItems.includes(itemId))return'';
  const cost=effectiveCost(itemId,proj,item);
  const lt=item.checked&&item.qty?cost*item.qty:0;
  const k=`${room.id}-${gKey}-${itemId}`;
  return`<div id="irow-${k}" class="flex items-center gap-3 px-4 py-2.5 border-b border-gray-50 last:border-0 ${item.checked?'':'opacity-40'}">
    <input type="checkbox" class="w-5 h-5 flex-shrink-0 accent-orange-500 cursor-pointer rounded"
      ${item.checked?'checked':''}
      data-checkbox data-room="${room.id}" data-gkey="${gKey}" data-item="${itemId}"/>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-medium leading-snug" style="color:#0a0e17">${esc(def.name)}</div>
      ${item.costOverride!=null
        ?`<button class="text-xs text-left active:opacity-60 leading-snug py-0.5" data-editprice data-room="${room.id}" data-gkey="${gKey}" data-item="${itemId}"><span class="text-orange-500 font-medium">${fmtCost(cost)}</span><span class="text-orange-300 text-[10px] ml-0.5">✎</span> <span style="color:rgba(10,14,23,0.3)">/ ${esc(def.unit)}</span></button>`
        :`<button class="text-xs text-left active:opacity-60 leading-snug py-0.5" data-editprice data-room="${room.id}" data-gkey="${gKey}" data-item="${itemId}"><span style="color:rgba(10,14,23,0.4)">${fmtCost(cost)}</span> <span style="color:rgba(10,14,23,0.25)">/ ${esc(def.unit)}</span></button>`}
    </div>
    <div class="flex items-center gap-1.5 flex-shrink-0">
      <input id="qty-${k}" type="number" min="0" step="0.5" inputmode="decimal"
        class="w-16 text-right bg-white border border-gray-200 rounded-lg px-2 py-2 font-medium focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-200"
        value="${item.qty||''}" placeholder="0"

  const sub=computeGroupSub(room,gKey);
  const isCollapsed=collapsed.has(`${room.id}|${gKey}`);

  return`<div class="border-b border-gray-100 last:border-0">
    <div class="flex items-center gap-2 px-4 py-3 cursor-pointer select-none active:opacity-80 relative overflow-hidden"

      <svg id="chev-${room.id}-${gKey}" class="w-4 h-4 flex-shrink-0 transition-transform ${isCollapsed?'-rotate-90':''}"

        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">

      <span id="nab-${room.id}-${gKey}"
        class="text-xs px-3 py-1.5 rounded-full font-medium cursor-pointer ${g.noAction?'na-on':'na-off'}"

        ${g.noAction?'✓ No Action':'No Action'}

}

function renderComparisonResult(pA,pB){
  const totA=computeTotal(pA), totB=computeTotal(pB);
  const {pct:pctA}=progressStats(pA), {pct:pctB}=progressStats(pB);
  const diff=Math.abs(totA-totB);
  const cheaper=totA<=totB?'a':'b';
  const diffPct=Math.max(totA,totB)>0?Math.round(diff/Math.max(totA,totB)*100):0;
  const secA=getSectionCosts(pA), secB=getSectionCosts(pB);
  const sectionRows=Object.entries(ROOM_TYPES).map(([type,rt])=>{
    const sa=secA[type]?.total||0, sb=secB[type]?.total||0;
    if(!sa&&!sb)return'';
    const mx=Math.max(sa,sb,1);
    const wA=Math.round(sa/mx*100), wB=Math.round(sb/mx*100);
    const diffS=Math.abs(sa-sb);
    const tag=diffS>0?`<span class="text-[10px] ${sa<sb?'text-green-600':'text-red-400'} font-medium ml-1">${sa<sb?'↓':'↑'}${fmt(diffS)}</span>`:'';
    return`<div class="mb-4">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-semibold text-gray-600">${rt.label}${tag}</span>
      </div>
      <div class="flex items-center gap-2 mb-1">
        <span class="w-3 h-3 rounded-sm bg-orange-500 flex-shrink-0"></span>
        <div class="flex-1 h-3 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full bg-[#EA580C] rounded-full transition-all" style="width:${wA}%"></div>
        </div>
        <span class="text-xs text-gray-700 w-14 text-right tabular-nums font-medium">${fmt(sa)}</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-sm flex-shrink-0" style="background:#5eead4"></span>
        <div class="flex-1 h-3 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all" style="width:${wB}%;background:#5eead4"></div>
        </div>
        <span class="text-xs text-gray-700 w-14 text-right tabular-nums font-medium">${fmt(sb)}</span>
      </div>
    </div>`;
  }).join('');
  return`<div class="sticky top-0 z-30 pt-safe" style="background:#0a0e17">
    <div class="flex items-center h-14 px-4 gap-3">
      <button data-action="compare-close" class="p-2 -ml-2 active:opacity-60" style="color:#eae5ec">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="flex-1 font-semibold text-sm" style="color:#eae5ec">Project Comparison</span>
      <button data-action="compare-reset" class="text-xs font-semibold px-3 py-2 active:opacity-70" style="color:#5eead4;min-height:44px">Reselect</button>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-3 px-4 pt-4 pb-1">
    <div class="bg-orange-50 border border-orange-100 rounded-2xl p-3.5">
      <div class="flex items-center gap-1.5 mb-1">
        <span class="w-2.5 h-2.5 rounded-sm bg-orange-500 flex-shrink-0"></span>
        <span class="text-[10px] font-bold text-orange-600 uppercase tracking-wider">Project A</span>
      </div>
      <div class="font-semibold text-gray-900 text-sm leading-snug truncate">${esc(pA.name)}</div>
      ${pA.address?`<div class="text-xs text-gray-500 truncate mt-0.5">${esc(pA.address)}</div>`:''}
      <div class="text-2xl font-bold text-[#111827] mt-2 tabular-nums">${fmt(totA)}</div>
      <div class="text-xs text-gray-500 mt-0.5">${pctA}% reviewed</div>
    </div>
    <div class="rounded-2xl p-3.5" style="background:#0a0e17">
      <div class="flex items-center gap-1.5 mb-1">
        <span class="w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:#5eead4"></span>
        <span class="text-[10px] font-bold uppercase tracking-wider" style="color:#5eead4">Project B</span>
      </div>
      <div class="font-semibold text-sm leading-snug truncate" style="color:#eae5ec">${esc(pB.name)}</div>
      ${pB.address?`<div class="text-xs truncate mt-0.5" style="color:rgba(234,229,236,0.5)">${esc(pB.address)}</div>`:''}
      <div class="text-2xl font-bold mt-2 tabular-nums" style="color:#eae5ec">${fmt(totB)}</div>
      <div class="text-xs mt-0.5" style="color:rgba(234,229,236,0.5)">${pctB}% reviewed</div>
    </div>
  </div>
  ${diff>0?`<div class="mx-4 my-3 px-4 py-2.5 rounded-xl flex items-center justify-center gap-2"
    style="${cheaper==='a'?'background:#fef9f0;border:1px solid #fed7aa':'background:#0a0e17'}">
    <span class="text-sm font-semibold" style="${cheaper==='a'?'color:#92400e':'color:#5eead4'}">
      Project ${cheaper.toUpperCase()} is ${fmt(diff)} less expensive (${diffPct}% cheaper)
    </span>
  </div>`:'<div class="mx-4 my-3 px-4 py-2.5 rounded-xl text-center text-sm font-medium" style="background:#f8f9fb;color:rgba(10,14,23,0.5)">Projects have equal estimated cost</div>'}

    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Cost by Section</p>
    <div class="flex items-center gap-4 mb-4">
      <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-orange-500"></span><span class="text-xs text-gray-600">Project A</span></div>
      <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm" style="background:#5eead4"></span><span class="text-xs text-gray-600">Project B</span></div>
    </div>
    ${sectionRows}
  </div>`;
}

function renderCompareView(){
  const list=loadList();
  if(list.length<2) return`<div class="flex flex-col items-center justify-center min-h-screen px-8 text-center">
    <div class="text-4xl mb-4">⚖</div>

}

function openPanel(){refreshPanelList();document.getElementById('panel-overlay').classList.remove('hidden');document.getElementById('side-panel').style.transform='translateX(0)'}

// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════════════
function setupListeners(){
  document.getElementById('close-panel').addEventListener('click',closePanel);
  document.getElementById('panel-overlay').addEventListener('click',closePanel);
  document.getElementById('panel-new').addEventListener('click',()=>{closePanel();openModal('new-proj')});
  document.getElementById('compare-btn').addEventListener('click',()=>{
    closePanel();cmpState={a:null,b:null};viewMode='compare';render();
  });

  document.body.addEventListener('click',e=>{
    if(e.target.matches('#modal-bg')||e.target.closest('[data-modal-cancel]')){closeModal();return}
    if(e.target.closest('[data-modal-confirm]')){confirmModal();return}

    const noAction=e.target.closest('[data-noaction]');
    if(noAction){e.stopImmediatePropagation();handleNoAction(noAction.dataset.room,noAction.dataset.gkey);return}

    const collapse=e.target.closest('[data-collapse]');
    if(collapse){handleToggleCollapse(collapse.dataset.room,collapse.dataset.gkey);return}

    if(e.target.closest('[data-open-side]')){openPanel();return}
    if(e.target.closest('[data-open-modal]')){openModal('new-proj');return}

    const sw=e.target.closest('[data-switch]');
    if(sw){const p=loadProj(sw.dataset.switch);if(p){proj=p;setActiveId(p.id);closePanel();render()}return}

    if(e.target.closest('[data-action="rename-proj"]')){openModal('rename-proj');return}
    if(e.target.closest('[data-action="open-settings"]')){openModal('settings');return}
    if(e.target.closest('[data-action="export"]')){exportProject();return}
    if(e.target.closest('[data-action="open-triage"]')){viewMode='triage';render();return}
    if(e.target.closest('[data-action="back-to-project"]')){viewMode='project';render();return}
    if(e.target.closest('[data-action="compare-close"]')){viewMode='project';render();return}
    if(e.target.closest('[data-action="compare-reset"]')){cmpState={a:null,b:null};render();return}
    const cmpPick=e.target.closest('[data-cmp-pick]');
    if(cmpPick){
      const[slot,id]=cmpPick.dataset.cmpPick.split('|');
      if(slot==='a'){cmpState.a=id;}else{cmpState.b=id;}
      render();return;
    }

    const rp=e.target.closest('[data-remove-photo]');
    if(rp){removePhoto(rp.dataset.removePhoto);return}

    const esn=e.target.closest('[data-edit-sn]');
    if(esn&&!e.target.matches('input')){startSNEdit(esn.dataset.editSn,esn);return}

    const ep=e.target.closest('[data-editprice]');
    if(ep){startPriceEdit(ep.dataset.room,ep.dataset.gkey,ep.dataset.item,ep);return}

    if(e.target.id==='reset-prices-btn'){
      setGlobalPrices({});closeModal();
      showToast('Prices reset to defaults');render();return;
    }
    if(e.target.id==='dl-prices-btn'){
      const csv=buildPriceCsv();
      const a=document.createElement('a');
      a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
      a.download='spark-prices.csv';a.click();return;
    }

    const addRoom_=e.target.closest('[data-add-room]');
    if(addRoom_){addRoom(addRoom_.dataset.addRoom);return}

    const renameRoom_=e.target.closest('[data-rename-room]');
    if(renameRoom_){openModal('rename-room',{roomId:renameRoom_.dataset.renameRoom});return}

    const removeRoom_=e.target.closest('[data-remove-room]');
    if(removeRoom_){openModal('remove-room',{roomId:removeRoom_.dataset.removeRoom});return}
  });

  document.body.addEventListener('change',e=>{
    const cb=e.target;
    if(cb.dataset.checkbox!==undefined)handleCheck(cb.dataset.room,cb.dataset.gkey,cb.dataset.item,cb.checked);
    if(cb.matches('[data-photo-input]')&&cb.files?.[0]){
      handlePhotoFile(cb.files[0]);
      cb.value='';
      return;
    }
    if(cb.id==='price-csv-input'&&cb.files?.[0]){
      const reader=new FileReader();
      reader.onload=ev=>{
        const prices=parseGlobalPriceCsv(ev.target.result);
        const n=Object.keys(prices).length;
        if(!n){showToast('No matching IDs found in CSV');return;}
        setGlobalPrices(prices);
        closeModal();
        showToast(`Updated ${n} item price${n!==1?'s':''} globally`);
        render();
      };
      reader.readAsText(cb.files[0]);
    }
  });

  document.body.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.qty!==undefined)handleQtyInput(el.dataset.room,el.dataset.gkey,el.dataset.item,el.value);
  });

  document.body.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&modalSt&&!document.getElementById('modal').classList.contains('hidden')){
      e.preventDefault();confirmModal();
    }
    if(e.key==='Escape'&&modalSt)closeModal();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
function init(){
  const id=getActiveId();
  if(id)proj=loadProj(id);
  if(!proj){
    const list=loadList();
    if(list.length>0){proj=loadProj(list[0].id);if(proj)setActiveId(proj.id)}
  }
  setupListeners();
  render();
}

init();
</script>

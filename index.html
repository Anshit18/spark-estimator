    /* ── Base ─────────────────────────────────────────────────────────────── */
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
    html{height:100%}
    body{margin:0;min-height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;overscroll-behavior:none;background:var(--c-bg);color:var(--c-t0)}
    input[type=text],input[type=number],input[type=file],textarea{font-size:max(16px,1rem)!important}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    .safe-bot{padding-bottom:max(16px,env(safe-area-inset-bottom))}
    .pt-safe{padding-top:max(0px,env(safe-area-inset-top))}
    #side-panel{transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .group-body{transition:opacity .15s}
    .cost-bar{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#fb923c,#ea580c);transition:width .45s cubic-bezier(.4,0,.2,1)}
    .room-cost-bar{position:absolute;bottom:0;left:0;height:3px;transition:width .45s cubic-bezier(.4,0,.2,1)}
    .na-on{background:rgba(70,192,138,0.15);color:#5fcf9a;border:1px solid rgba(70,192,138,0.3)}
    .na-off{background:var(--c-naoff-bg);color:var(--c-t4);border:1px solid var(--c-naoff-br)}
    /* gradient text */
    html[data-theme="dark"] .grad-orange{background:linear-gradient(170deg,#ffe4c2 0%,#f97316 55%,#c2440a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    html[data-theme="light"] .grad-orange{background:linear-gradient(170deg,#ea580c 0%,#c2440a 55%,#9a3008 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    html[data-theme="dark"] .grad-total{background:linear-gradient(160deg,#fff1e0 0%,#ffa94d 40%,#ea580c 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    html[data-theme="light"] .grad-total{background:linear-gradient(160deg,#ea580c 0%,#c2440a 50%,#9a2e06 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .mono{font-family:'IBM Plex Mono',monospace}
    .num-col{font-variant-numeric:tabular-nums;text-align:right;min-width:58px;display:inline-block}
    /* triage glows */
    html[data-theme="dark"] .triage-glow-1{box-shadow:0 0 0 1px rgba(251,146,60,0.45),0 8px 32px -8px rgba(234,88,12,0.6),inset 0 0 24px rgba(234,88,12,0.06)}

    html[data-theme="dark"] .triage-glow-3{box-shadow:0 0 0 1px rgba(251,146,60,0.20),0 4px 16px -8px rgba(234,88,12,0.30)}

    .surf-4{background:var(--c-s3)}
    .surf-5{background:var(--c-s4)}

<!-- ── Side panel ─────────────────────────────────────────────────────── -->
<div id="panel-overlay" class="fixed inset-0 z-40 hidden" style="background:var(--c-ov-panel);backdrop-filter:blur(3px)"></div>
<div id="side-panel" class="fixed top-0 left-0 h-full w-72 z-50 -translate-x-full flex flex-col" style="background:var(--c-s2);box-shadow:var(--c-panel-sh)">
  <div class="px-4 pt-safe flex-shrink-0" style="background:var(--c-s1);border-bottom:1px solid var(--c-bw)">
    <div class="flex items-center justify-between py-4 mt-1">
      <span class="font-bold text-base" style="color:var(--c-t0)">Projects</span>
      <button id="close-panel" class="p-2 text-xl leading-none active:opacity-60" style="color:var(--c-t4);min-width:44px;min-height:44px">✕</button>
    </div>
  </div>
  <div id="panel-list" class="flex-1 overflow-y-auto"></div>
  <div class="p-4 flex-shrink-0 safe-bot space-y-2" style="border-top:1px solid var(--c-bw);background:var(--c-s1)">
    <button id="compare-btn" class="w-full py-2.5 rounded-xl font-semibold text-sm active:opacity-70 flex items-center justify-center gap-2" style="background:var(--c-s3);border:1px solid var(--c-bwm);color:var(--c-t2)">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      Compare Projects
    </button>
    <button id="panel-new" class="w-full py-3 rounded-xl text-white font-semibold text-sm active:opacity-80" style="background:linear-gradient(160deg,#f97316,#c2440a);box-shadow:0 8px 22px -6px rgba(234,88,12,0.55)">+ New Project</button>
  </div>
</div>

<!-- ── Modal ─────────────────────────────────────────────────────────── -->
<div id="modal" class="fixed inset-0 z-[60] hidden">
  <div id="modal-bg" class="absolute inset-0" style="background:var(--c-ov-modal);backdrop-filter:blur(4px)"></div>
  <div class="absolute inset-0 overflow-y-auto pointer-events-none">
    <div class="flex min-h-full items-center justify-center p-5">
      <div id="modal-box" class="rounded-2xl w-full max-w-sm pointer-events-auto my-auto" style="background:var(--c-modal-box);box-shadow:var(--c-modal-sh)"></div>
    </div>
  </div>
</div>

<!-- ── App root ───────────────────────────────────────────────────────── -->
<div id="app" class="max-w-lg mx-auto"></div>

const THEME_KEY='spark_theme';

function isDark(){return document.documentElement.dataset.theme!=='light'}

function getAccent(gKey){
  return isDark()?(GROUP_ACCENT[gKey]||{text:'#fb923c',bar:'linear-gradient(90deg,#fb923c,#ea580c)',glow:'rgba(234,88,12,0.45)'})
                 :(GROUP_ACCENT_LIGHT[gKey]||{text:'#c2440a',bar:'linear-gradient(90deg,#fb923c,#c2440a)',glow:'rgba(194,68,10,0.30)'});
}

function getRoomColors(type){
  return isDark()?(ROOM_COLORS[type]||ROOM_COLORS.interior)
                 :(ROOM_COLORS_LIGHT[type]||ROOM_COLORS_LIGHT.interior);
}

function applyTheme(t){
  document.documentElement.dataset.theme=t;
  document.getElementById('meta-theme-color').content=t==='dark'?'#1e1710':'#ede5da';
}

function initTheme(){
  const saved=localStorage.getItem(THEME_KEY);
  const preferred=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  applyTheme((saved==='dark'||saved==='light')?saved:preferred);
}

function toggleTheme(){
  const next=isDark()?'light':'dark';
  localStorage.setItem(THEME_KEY,next);
  applyTheme(next);
  render();
}

// ═══════════════════════════════════════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function makeGroupState(gKey){
  const items={};
  (GROUPS[gKey]?.items||[]).forEach(id=>{items[id]={qty:0,checked:false,costOverride:null}});
  return {noAction:false,items,customItems:[],removedItems:[]};
}

function makeRoom(type,label){
  const groups={};
  ROOM_TYPES[type].groups.forEach(gKey=>{groups[gKey]=makeGroupState(gKey)});
  return {id:uid(),type,label,groups};
}

function makeProject(name,address=''){
  return {
    id:uid(), name, address,
    createdAt:Date.now(), updatedAt:Date.now(),
    rooms:[
      makeRoom('interior','Interior / General'),
      makeRoom('systems', 'Systems & Structure'),
      makeRoom('exterior','Exterior'),
      makeRoom('kitchen', 'Kitchen'),
      makeRoom('bathroom','Bathroom 1'),
    ],
    priceOverrides:{},
    photos:[],
    notes:'',
  };
}

function loadList()    {return LS.get('spark_projects',[])}
function saveList(l)   {LS.set('spark_projects',l)}
function loadProj(id)  {return LS.get(`spark_proj_${id}`,null)}
function saveProj(p){
  p.updatedAt=Date.now();
  LS.set(`spark_proj_${p.id}`,p);
  const list=loadList();
  const i=list.findIndex(x=>x.id===p.id);
  const s={id:p.id,name:p.name,address:p.address,updatedAt:p.updatedAt};
  if(i>=0)list[i]=s; else list.unshift(s);
  saveList(list);
}
function deleteProj(id){
  LS.rm(`spark_proj_${id}`);
  saveList(loadList().filter(p=>p.id!==id));
  if(LS.get('spark_active')===id)LS.rm('spark_active');
}
function getActiveId() {return LS.get('spark_active',null)}
function setActiveId(id){LS.set('spark_active',id)}
function getGlobalPrices(){return LS.get('spark_gprices',{})}
function setGlobalPrices(p){LS.set('spark_gprices',p)}

function effectiveCost(itemId,p,itemState){
  const gp=getGlobalPrices();
  return itemState?.costOverride??p.priceOverrides[itemId]??gp[itemId]??CATALOG[itemId]?.cost??0;
}

function computeTotal(p){
  let t=0;
  for(const room of p.rooms)
    for(const[,g]of Object.entries(room.groups)){
      if(g.noAction)continue;
      for(const[id,item]of Object.entries(g.items)){
        if(!item.checked||!item.qty||g.removedItems.includes(id))continue;
        t+=effectiveCost(id,p,item)*item.qty;
      }
      for(const ci of g.customItems){if(ci.checked&&ci.qty)t+=(ci.cost||0)*ci.qty}
    }
  return t;
}

function computeGroupSub(room,gKey){
  const g=room.groups[gKey];
  if(!g||g.noAction)return 0;
  let t=0;
  for(const[id,item]of Object.entries(g.items)){
    if(item.checked&&item.qty&&!g.removedItems.includes(id))
      t+=effectiveCost(id,proj,item)*item.qty;
  }
  for(const ci of g.customItems){if(ci.checked&&ci.qty)t+=(ci.cost||0)*ci.qty}
  return t;
}

function computeRoomSub(room){
  return Object.keys(room.groups).reduce((s,gKey)=>s+computeGroupSub(room,gKey),0);
}

// ── Phase 8: triage and comparison helpers ────────────────────────────────

function getTriageItems(p){
  const all=[];
  for(const room of p.rooms){
    for(const[gKey,g]of Object.entries(room.groups)){
      if(g.noAction)continue;
      for(const[id,item]of Object.entries(g.items)){
        if(!item.checked||!item.qty||g.removedItems.includes(id))continue;
        const cost=effectiveCost(id,p,item);
        const lt=cost*item.qty;
        if(lt>0)all.push({room:room.label,group:GROUPS[gKey]?.label||'',name:CATALOG[id].name,qty:item.qty,unit:CATALOG[id].unit,lt});
      }
      for(const ci of g.customItems){
        if(!ci.checked||!ci.qty)continue;
        const lt=(ci.cost||0)*ci.qty;
        if(lt>0)all.push({room:room.label,group:GROUPS[gKey]?.label||'',name:ci.name+' ✎',qty:ci.qty,unit:ci.unit||'ea.',lt});
      }
    }
  }
  all.sort((a,b)=>b.lt-a.lt);
  const total=all.reduce((s,i)=>s+i.lt,0);
  let run=0,cutoff=all.length-1;
  for(let i=0;i<all.length;i++){run+=all[i].lt;if(run>=total*0.80){cutoff=i;break;}}
  return{items:all,cutoff,total};
}

function getSectionCosts(p){
  const out={};
  for(const[type,rt]of Object.entries(ROOM_TYPES))out[type]={label:rt.label,total:0};
  for(const room of p.rooms)
    if(out[room.type])out[room.type].total+=computeRoomSub(room);
  return out;
}

function getGroupCosts(p){
  const out={};
  for(const room of p.rooms){
    for(const[gKey,g]of Object.entries(room.groups)){
      if(!out[gKey])out[gKey]={label:GROUPS[gKey]?.label||gKey,total:0};
      if(g.noAction)continue;
      for(const[id,item]of Object.entries(g.items)){
        if(item.checked&&item.qty&&!g.removedItems.includes(id))
          out[gKey].total+=effectiveCost(id,p,item)*item.qty;
      }
      for(const ci of g.customItems){if(ci.checked&&ci.qty)out[gKey].total+=(ci.cost||0)*ci.qty}
    }
  }
  return out;
}

// ── Phase 5: progress tracking ────────────────────────────────────────────

function progressStats(p){
  let total=0,done=0;
  for(const room of p.rooms)
    for(const[,g]of Object.entries(room.groups)){
      total++;
      const anyItem=Object.entries(g.items).some(([id,i])=>i.checked&&!g.removedItems.includes(id));
      if(g.noAction||anyItem||g.customItems.some(c=>c.checked))done++;
    }
  return{pct:total?Math.round(done/total*100):0,done,total};
}

// ── Phase 3: room management ──────────────────────────────────────────────

function nextRoomNumber(type){
  const same=proj.rooms.filter(r=>r.type===type);
  if(!same.length)return 1;
  const nums=same.map(r=>{const m=r.label.match(/(\d+)$/);return m?parseInt(m[1]):0});
  return Math.max(...nums)+1;
}

function roomHasData(room){
  for(const g of Object.values(room.groups)){
    if(g.noAction)return true;
    if(Object.values(g.items).some(i=>i.checked||i.qty>0||i.costOverride!=null))return true;
    if(g.customItems.length>0)return true;
  }
  return false;
}

function addRoom(type){
  const rt=ROOM_TYPES[type];
  const n=nextRoomNumber(type);
  const label=rt.singleton?rt.label:`${rt.label} ${n}`;
  proj.rooms.push(makeRoom(type,label));
  saveProj(proj);render();
}

function removeRoom(roomId){
  proj.rooms=proj.rooms.filter(r=>r.id!==roomId);
  saveProj(proj);render();
}

function renameRoom(roomId,label){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(room){room.label=label;saveProj(proj);render();}
}

    document.body.appendChild(el);
  }
  el.style.cssText=`background:${isDark()?'#1a1410':'#2e1a08'};color:#fff;box-shadow:0 4px 20px rgba(0,0,0,${isDark()?'0.5':'0.3'})`;
  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.style.opacity='0'},ms);
}

function patchLineTotal(roomId,gKey,itemId){
  const room=proj.rooms.find(r=>r.id===roomId);
  const item=room?.groups[gKey]?.items[itemId];
  if(!item)return;
  const lt=item.checked&&item.qty?effectiveCost(itemId,proj,item)*item.qty:0;
  const el=document.getElementById(`lt-${roomId}-${gKey}-${itemId}`);
  if(el)el.textContent=lt>0?fmt(lt):'';
}
function patchGroupSub(roomId,gKey){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const sub=computeGroupSub(room,gKey);
  const el=document.getElementById(`gsub-${roomId}-${gKey}`);
  if(el)el.textContent=sub>0?fmt(sub):'';
  const bar=document.getElementById(`gbar-${roomId}-${gKey}`);
  if(bar){const t=computeTotal(proj);bar.style.width=(t>0?Math.min(Math.round(sub/t*100),100):0)+'%';}
}
function patchRoomSub(roomId){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const sub=computeRoomSub(room);
  const el=document.getElementById(`rsub-${roomId}`);
  if(el)el.textContent=sub>0?fmt(sub):'';

}
function patchFooter(){
  const el=document.getElementById('footer-total');
  if(el)el.textContent=fmt(computeTotal(proj));
}

function patchProgress(){
  const{pct,done,total}=progressStats(proj);
  const bar=document.getElementById('progress-bar');
  const txt=document.getElementById('progress-txt');
  const lbl=document.getElementById('progress-label');
  if(bar){

function handleCheck(roomId,gKey,itemId,checked){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;
  const item=room.groups[gKey]?.items[itemId];
  if(!item)return;
  item.checked=checked;

    const tmp=document.createElement('div');

  }
  patchLineTotal(roomId,gKey,itemId);
  patchGroupSub(roomId,gKey);
  patchRoomSub(roomId);
  patchFooter();
  patchProgress();
}

function handleQtyInput(roomId,gKey,itemId,value){
  const room=proj.rooms.find(r=>r.id===roomId);
  if(!room)return;

function handleNoAction(roomId,gKey){
  const room=proj.rooms.find(r=>r.id===roomId);

function handleToggleCollapse(roomId,gKey){
  const key=`${roomId}|${gKey}`;

// EXCEL WORKBOOK BUILDER — Phase 7
// ═══════════════════════════════════════════════════════════════════════════
function buildWorkbook(p){
  const rows=[], styleMap={};
  let ri=0;
  const R  =(...cols)=>{const i=ri++;rows.push(cols);return i;};
  const S  =(r,c,s)=>{(styleMap[r]??(styleMap[r]={}))[c]=s;};
  const enc=(r,c)=>XLSX.utils.encode_cell({r,c});
  const ORANGE='EA580C', WHITE='FFFFFF', DARK='1F2937',
        LORANGE='FFF7ED', GREEN='16A34A';
  const r0=R('Spark Homes — Repair Estimate','','','','','','');
  S(r0,0,{font:{bold:true,sz:16,color:{rgb:ORANGE}}});
  const r1=R(`Project: ${p.name}`,'','','','','','');
  S(r1,0,{font:{bold:true,sz:11}});
  if(p.address){ const ra=R(`Address: ${p.address}`,'','','','','',''); S(ra,0,{font:{sz:10,color:{rgb:'555555'}}}); }
  const dateStr=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const rd=R(`Date: ${dateStr}`,'','','','','',''); S(rd,0,{font:{sz:10,color:{rgb:'555555'}}});
  R();
  const hdrStyle=(col)=>({
    font:{bold:true,sz:10,color:{rgb:WHITE}},
    fill:{fgColor:{rgb:ORANGE},patternType:'solid'},
    alignment:{horizontal:col>=3?'right':'left',vertical:'center'},
  });
  const hRow=R('Room','Group','Item','Qty','Unit','Unit Cost','Line Total');
  for(let c=0;c<7;c++) S(hRow,c,hdrStyle(c));
  let grandTotal=0, lastRoom='';
  for(const room of p.rooms){
    let roomTotal=0, roomHasContent=false;
    for(const[gKey,g]of Object.entries(room.groups)){
      const gDef=GROUPS[gKey]; if(!gDef)continue;
      if(g.noAction){
        const r=R(room.label,gDef.label,'✓ No Action Needed','','','','');
        S(r,0,room.label!==lastRoom?{font:{bold:true}}:{});
        S(r,2,{font:{italic:true,color:{rgb:GREEN}}});
        lastRoom=room.label; roomHasContent=true; continue;
      }
      for(const[itemId,item]of Object.entries(g.items)){
        if(!item.checked||!item.qty||g.removedItems.includes(itemId))continue;
        const def=CATALOG[itemId];
        const cost=effectiveCost(itemId,p,item);
        const lt=cost*item.qty;
        const r=R(room.label,gDef.label,def.name,item.qty,def.unit,cost,lt);
        if(room.label!==lastRoom) S(r,0,{font:{bold:true}});
        S(r,3,{alignment:{horizontal:'right'}});
        S(r,5,{numFmt:'$#,##0.00',alignment:{horizontal:'right'},font:{sz:10}});
        S(r,6,{numFmt:'$#,##0.00',alignment:{horizontal:'right'},font:{bold:true,sz:10}});
        lastRoom=room.label; roomTotal+=lt; roomHasContent=true;
      }
      for(const ci of g.customItems){
        if(!ci.checked||!ci.qty)continue;
        const lt=(ci.cost||0)*ci.qty;
        const r=R(room.label,gDef.label,`${ci.name} (custom)`,ci.qty,ci.unit||'ea.',ci.cost||0,lt);
        S(r,5,{numFmt:'$#,##0.00',alignment:{horizontal:'right'}});
        S(r,6,{numFmt:'$#,##0.00',alignment:{horizontal:'right'},font:{bold:true}});
        lastRoom=room.label; roomTotal+=lt; roomHasContent=true;
      }
    }
    if(roomHasContent&&roomTotal>0){
      const sr=R('','','','','',`${room.label} Subtotal`,roomTotal);
      S(sr,5,{font:{bold:true},alignment:{horizontal:'right'},fill:{fgColor:{rgb:LORANGE},patternType:'solid'}});
      S(sr,6,{numFmt:'$#,##0.00',font:{bold:true},alignment:{horizontal:'right'},fill:{fgColor:{rgb:LORANGE},patternType:'solid'}});
    }
    if(roomHasContent) R();
    grandTotal+=roomTotal;
  }
  const snPhotos=p.photos.filter(ph=>ph.serialNumber);
  if(snPhotos.length){
    R();
    const sh=R('Serial Numbers Captured','','','','','','');
    S(sh,0,{font:{bold:true,sz:11,color:{rgb:ORANGE}}});
    for(const ph of snPhotos){
      const sr=R(ph.name,ph.serialNumber,'','','','','');
      S(sr,0,{font:{sz:10,color:{rgb:'555555'}}});
      S(sr,1,{font:{bold:true,sz:10,name:'Courier New'}});
    }
    R();
  }
  R();
  const gr=R('','','','','','GRAND TOTAL',grandTotal);
  S(gr,5,{font:{bold:true,sz:12,color:{rgb:WHITE}},fill:{fgColor:{rgb:DARK},patternType:'solid'},alignment:{horizontal:'right',vertical:'center'}});
  S(gr,6,{numFmt:'$#,##0.00',font:{bold:true,sz:12,color:{rgb:'F97316'}},fill:{fgColor:{rgb:DARK},patternType:'solid'},alignment:{horizontal:'right',vertical:'center'}});
  const ws=XLSX.utils.aoa_to_sheet(rows);
  for(const[rStr,cols]of Object.entries(styleMap)){
    for(const[cStr,s]of Object.entries(cols)){
      const a=enc(+rStr,+cStr);
      if(ws[a])ws[a].s=s;
    }
  }
  ws['!cols']=[{wch:22},{wch:22},{wch:40},{wch:8},{wch:18},{wch:14},{wch:14}];
  if(!ws['!merges'])ws['!merges']=[];
  ws['!merges'].push({s:{r:0,c:0},e:{r:0,c:6}});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Repair Estimate');
  return wb;
}

async function exportProject(){
  const btn=document.querySelector('[data-action="export"]');
  if(btn){btn.disabled=true;btn.textContent='Building…';}
  try{
    const wb=buildWorkbook(proj);
    const xlsxData=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const zip=new JSZip();
    zip.file('estimate.xlsx',xlsxData);
    if(proj.photos.length){
      const folder=zip.folder('photos');
      proj.photos.forEach((ph,i)=>{
        const n=String(i+1).padStart(3,'0');
        const snTag=ph.serialNumber?`-SN-${ph.serialNumber.replace(/[^\w-]/g,'_')}`:'';
        const b64=(ph.dataUrl||'').split(',')[1]||'';
        folder.file(`photo-${n}${snTag}.jpg`,b64,{base64:true});
      });
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const dateStr=new Date().toISOString().slice(0,10);
    const safeName=(proj.name||'estimate').replace(/[^\w\s-]/g,'').trim()
      .replace(/\s+/g,'-').toLowerCase().slice(0,40)||'estimate';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${safeName}-${dateStr}.zip`;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a);},1000);
    const photoLine=proj.photos.length?` + ${proj.photos.length} photo${proj.photos.length!==1?'s':''}`:' (no photos)';
    showToast(`Exported estimate.xlsx${photoLine}`);
  }catch(err){
    console.error('Export error:',err);
    showToast('Export failed — '+err.message,5000);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Export ZIP';}
  }
}

const LS_WARN_AT  = 4.2*1024*1024;
const LS_BLOCK_AT = 4.8*1024*1024;

function lsUsedChars(){
  let t=0;
  try{ for(const k of Object.keys(localStorage)) t+=(localStorage.getItem(k)||'').length; }
  catch{}
  return t;
}

function compressImage(file,maxPx=1024,quality=0.72){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){
          if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
          else{w=Math.round(w*maxPx/h);h=maxPx;}
        }
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function tryDetectBarcode(dataUrl){
  if(!('BarcodeDetector' in window))return null;
  try{
    const detector=new BarcodeDetector();
    const img=new Image();
    img.src=dataUrl;
    await new Promise(r=>{img.onload=r;img.onerror=r});
    const codes=await detector.detect(img);
    const sorted=codes.slice().sort((a,b)=>b.rawValue.length-a.rawValue.length);
    return sorted[0]?.rawValue||null;
  }catch{return null;}
}

async function handlePhotoFile(file,roomId=null){
  if(!file||!file.type.startsWith('image/'))return;
  const dataUrl=await compressImage(file);
  const targetProj=proj;

  const used=lsUsedChars();
  const incoming=dataUrl.length;
  if(used+incoming>LS_BLOCK_AT){showToast('Storage full — remove photos to free space before adding more.',5000);return;}
  if(used+incoming>LS_WARN_AT){showToast(`Storage nearly full (${Math.round((used+incoming)/1024/1024*10)/10} MB used). Consider exporting and clearing photos.`,4000);}

  const photo={id:uid(),dataUrl,name:`Photo ${targetProj.photos.length+1}`,timestamp:Date.now(),serialNumber:null,scanning:true,roomId:roomId||null};
  targetProj.photos.push(photo);
  try{saveProj(targetProj);}
  catch(e){
    if(e.name==='QuotaExceededError'||e.message?.includes('quota')){
      targetProj.photos.pop();showToast('Storage full — photo not saved.',5000);return;
    }
    throw e;
  }
  if(proj===targetProj){
    patchPhotosSection();
    if(roomId)patchRoomPhotoStrip(roomId);
  }

  const sn=await tryDetectBarcode(dataUrl);
  const p=targetProj.photos.find(x=>x.id===photo.id);
  if(p){
    p.serialNumber=sn;p.scanning=false;saveProj(targetProj);
    if(proj===targetProj){
      patchPhotosSection();
      if(roomId)patchRoomPhotoStrip(roomId);
    }
  }
  if(sn)showToast(`Serial detected: ${sn}`);
}

function parseGlobalPriceCsv(text){
  const prices={};
  text.trim().split('\n').slice(1).forEach(line=>{
    const cols=line.split(',');
    const id=(cols[0]||'').trim().replace(/^"|"$/g,'');
    const cost=parseFloat((cols[2]||'').trim().replace(/^"|"$/g,''));
    if(id&&!isNaN(cost)&&CATALOG[id])prices[id]=cost;
  });
  return prices;
}

function buildPriceCsv(){
  const gp=getGlobalPrices();
  const rows=['id,name,cost,unit'];
  for(const[id,def]of Object.entries(CATALOG)){
    const cost=gp[id]??def.cost;
    rows.push(`${id},"${def.name.replace(/"/g,'""')}",${cost},"${def.unit}"`);
  }
  return rows.join('\n');
}

function priceBtn(roomId,gKey,itemId,cost,unit,hasOverride){

  btn.dataset.editprice='';
  btn.dataset.room=roomId;
  btn.dataset.gkey=gKey;
  btn.dataset.item=itemId;
  btn.innerHTML=hasOverride
    ?`<span class="text-orange-500 font-medium">${fmtCost(cost)}</span><span class="text-orange-300 text-[10px] ml-0.5">✎</span> <span class="mono" style="color:var(--c-t6)">/ ${esc(unit)}</span>`
    :`<span class="mono" style="color:var(--c-t6)">${fmtCost(cost)} / ${esc(unit)}</span>`;
  return btn;
}

function startPriceEdit(roomId,gKey,itemId,triggerEl){
  const room=proj.rooms.find(r=>r.id===roomId);
  const item=room?.groups[gKey]?.items[itemId];
  const def=CATALOG[itemId];
  if(!item||!def)return;
  const current=effectiveCost(itemId,proj,item);
  const inp=document.createElement('input');
  inp.type='number';inp.min='0';inp.step='0.01';inp.inputMode='decimal';
  inp.value=current;
  inp.className='text-orange-600 bg-orange-50 border border-orange-300 rounded-lg px-2 py-2 w-28 focus:outline-none focus:border-orange-500';
  triggerEl.replaceWith(inp);
  inp.focus();inp.select();
  const save=()=>{
    const v=parseFloat(inp.value);
    const base=effectiveCost(itemId,proj,{...item,costOverride:null});
    if(inp.value===''||isNaN(v)||v<0){item.costOverride=null;}
    else{item.costOverride=(Math.abs(v-base)<0.001)?null:v;}
    saveProj(proj);
    const newCost=effectiveCost(itemId,proj,item);
    const newBtn=priceBtn(roomId,gKey,itemId,newCost,def.unit,item.costOverride!=null);
    inp.replaceWith(newBtn);
    patchLineTotal(roomId,gKey,itemId);
    patchGroupSub(roomId,gKey);
    patchRoomSub(roomId);
    patchFooter();
    if(item.costOverride!=null)showToast(`Price set to ${fmtCost(item.costOverride)} for this room`);
    else if(inp.value!=='')showToast('Price reset to standard');
  };
  inp.addEventListener('blur',save,{once:true});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){
      inp.removeEventListener('blur',save);
      const restoredBtn=priceBtn(roomId,gKey,itemId,current,def.unit,item.costOverride!=null);
      inp.replaceWith(restoredBtn);
    }
  });
}

function openModal(mode,extra={}){
  modalSt={mode,...extra};
  document.getElementById('modal-box').innerHTML=renderModalContent(modalSt);
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>{
    const inp=document.getElementById('mf1');
    if(inp){inp.focus();inp.scrollIntoView({behavior:'smooth',block:'center'});}
  },80);
}
function closeModal(){
  document.getElementById('modal').classList.add('hidden');
  modalSt=null;
}
function confirmModal(){
  const{mode,roomId}=modalSt||{};
  if(mode==='new-proj'||mode==='rename-proj'){
    const name=document.getElementById('mf1')?.value.trim();
    if(!name){document.getElementById('mf1')?.focus();return;}
    const addr=document.getElementById('mf2')?.value.trim()||'';
    if(mode==='new-proj'){
      const p=makeProject(name,addr);saveProj(p);proj=p;setActiveId(p.id);
    }else{
      proj.name=name;proj.address=addr;saveProj(proj);
    }
    closeModal();render();
  }
  else if(mode==='rename-room'){
    const name=document.getElementById('mf1')?.value.trim();
    if(!name){document.getElementById('mf1')?.focus();return;}
    renameRoom(roomId,name);
    closeModal();
  }
  else if(mode==='remove-room'){
    removeRoom(roomId);
    closeModal();
  }
}

  const sub=computeRoomSub(room);
  const roomBarPct=projTotal>0?Math.min(Math.round(sub/projTotal*100),100):0;
  const pencilSvg=`<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="color:var(--c-bc)">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
  </svg>`;
  const closeSvg=`<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">

  const subGrad=sub>0?`background:linear-gradient(170deg,${rc.text},${rc.dot}cc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent`:'';

      <span class="flex-shrink-0" style="width:10px;height:10px;border-radius:50%;background:${rc.dot};box-shadow:0 0 12px ${rc.glow},0 0 4px ${rc.dot}"></span>
      <button class="flex items-center gap-1.5 min-w-0 flex-1 active:opacity-70 text-left"
        data-rename-room="${room.id}" title="Tap to rename">

function renderTriageView(){
  const{items,cutoff,total}=getTriageItems(proj);
  const paretoItems=items.slice(0,cutoff+1);
  const restItems=items.slice(cutoff+1);
  const restTotal=restItems.reduce((s,i)=>s+i.lt,0);
  const maxCost=items[0]?.lt||1;
  const paretoPct=total>0?Math.round(paretoItems.reduce((s,i)=>s+i.lt,0)/total*100):0;
  const iconBtn=`display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--c-s3);border:1px solid var(--c-bw);color:var(--c-t2)`;
  const backBtn=`<button data-action="back-to-project" class="active:opacity-60 flex-shrink-0" style="${iconBtn}">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>

  const header=`<div class="sticky top-0 z-30 pt-safe" style="background:var(--c-head-bg);border-bottom:1px solid var(--c-bw)">

        <div class="font-semibold" style="font-size:15px;color:var(--c-t0)">Cost Triage</div>
        <div class="truncate" style="font-size:12px;color:var(--c-t4)">${esc(proj.name)}</div>
      </div>
      <div class="text-right flex-shrink-0">
        <div style="font-size:10px;letter-spacing:0.12em;color:var(--c-t4);font-weight:600">TOTAL</div>
        <div class="mono font-bold tabular-nums grad-total" style="font-size:16px">${fmt(total)}</div>
      </div>
      <button data-action="toggle-theme" class="active:opacity-60 flex-shrink-0" style="${iconBtn}" title="Toggle theme">
        ${themeBtnSvg()}

  if(!items.length) return header+`<div class="flex flex-col items-center justify-center py-20 px-8 text-center">
    <div class="flex items-center justify-center mb-4" style="width:56px;height:56px;border-radius:16px;background:var(--c-s3);border:1px solid var(--c-bw)">
      <svg class="w-7 h-7" style="color:var(--c-t5)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>

  </div>`;

  // Pareto callout card
  const pareto=`<div class="px-4 pt-4">
    <div style="background:radial-gradient(120% 130% at 100% 0%,rgba(234,88,12,0.18),rgba(0,0,0,0) 60%),linear-gradient(160deg,var(--c-s3) 0%,var(--c-s3) 100%);border:1px solid rgba(249,115,22,0.28);border-radius:16px;padding:15px 16px;box-shadow:0 12px 40px -12px rgba(194,68,10,0.3),inset 0 1px 0 var(--c-bws)">
      <div style="font-size:10px;letter-spacing:0.14em;color:#f7a04a;font-weight:600">PARETO CUTOFF</div>
      <div class="flex items-end justify-between mt-1">
        <div>
          <div class="mono grad-total" style="font-size:34px;font-weight:600;line-height:1">${paretoPct}%</div>
          <div style="font-size:13px;color:var(--c-t2);padding-bottom:3px">${paretoItems.length} item${paretoItems.length!==1?'s':''} drive ${paretoPct}% of cost</div>
        </div>
      </div>
      <div style="margin-top:12px;height:7px;border-radius:5px;background:var(--c-track);overflow:hidden;position:relative">
        <div style="height:100%;width:${paretoPct}%;border-radius:5px;background:linear-gradient(90deg,#fb923c,#c2440a);box-shadow:0 0 10px rgba(234,88,12,0.6)"></div>
        <div style="position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:rgba(255,255,255,0.5)"></div>
      </div>
      <div style="font-size:10px;letter-spacing:0.12em;color:var(--c-t4);margin-top:5px">80% threshold marker</div>
    </div>
  </div>`;

  // Triage item cards — warm glow scales with cost rank
  const triageGlowCls=['triage-glow-1','triage-glow-1','triage-glow-2','triage-glow-2','triage-glow-3','triage-glow-3',''];
  const triBgDark=[
    'radial-gradient(120% 120% at 100% 0%,rgba(234,88,12,0.20),rgba(0,0,0,0) 50%),linear-gradient(160deg,#1f2430 0%,#18202a 100%)',
    'radial-gradient(120% 120% at 100% 0%,rgba(234,88,12,0.15),rgba(0,0,0,0) 50%),linear-gradient(160deg,#1b2129 0%,#161d24 100%)',
    'radial-gradient(120% 120% at 100% 0%,rgba(234,88,12,0.11),rgba(0,0,0,0) 50%),linear-gradient(160deg,#181f27 0%,#131a21 100%)',
    'linear-gradient(160deg,#161d24 0%,#121820 100%)',
    'linear-gradient(160deg,#141b22 0%,#10161c 100%)',
    'linear-gradient(160deg,#13191f 0%,#0f151b 100%)',
    'linear-gradient(160deg,#11171d 0%,#0e1319 100%)',
  ];
  const triBgLight=[
    'radial-gradient(120% 120% at 100% 0%,rgba(234,88,12,0.13),transparent 50%),linear-gradient(160deg,#eef1f6 0%,#e8ecf3 100%)',
    'radial-gradient(120% 120% at 100% 0%,rgba(234,88,12,0.09),transparent 50%),linear-gradient(160deg,#eaedf4 0%,#e4e8f0 100%)',
    'radial-gradient(120% 120% at 100% 0%,rgba(234,88,12,0.06),transparent 50%),linear-gradient(160deg,#e7eaf1 0%,#e1e5ee 100%)',
    'linear-gradient(160deg,#e5e9f0 0%,#dfe3ec 100%)',
    'linear-gradient(160deg,#e3e7ee 0%,#dde1ea 100%)',
    'linear-gradient(160deg,#e1e5ec 0%,#dbe0e8 100%)',
    'linear-gradient(160deg,#dfe3ea 0%,#d9dee7 100%)',
  ];
  const triBdrDark=[
    'rgba(249,115,22,0.40)','rgba(249,115,22,0.30)','rgba(249,115,22,0.22)',
    'rgba(249,115,22,0.15)','rgba(249,115,22,0.10)','rgba(249,115,22,0.07)','rgba(249,115,22,0.05)',
  ];
  const triBdrLight=[
    'rgba(234,88,12,0.35)','rgba(234,88,12,0.25)','rgba(234,88,12,0.18)',
    'rgba(234,88,12,0.12)','rgba(234,88,12,0.09)','rgba(234,88,12,0.06)','rgba(234,88,12,0.04)',
  ];
  const triBg=isDark()?triBgDark:triBgLight;
  const triBdr=isDark()?triBdrDark:triBdrLight;

  const itemRows=paretoItems.map((item,i)=>{
    const barPct=Math.round(item.lt/maxCost*100);
    const sharePct=Math.round(item.lt/total*100);
    const bgIdx=Math.min(i,triBg.length-1);
    const glowCls=triageGlowCls[Math.min(i,triageGlowCls.length-1)];
    return`<div class="px-4 mt-3">
      <div class="${glowCls}" style="background:${triBg[bgIdx]};border:1px solid ${triBdr[bgIdx]};border-radius:14px;padding:12px 14px">

          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">

                <div class="font-semibold leading-snug" style="font-size:14px;color:var(--c-t1)">${esc(item.name)}</div>
                <div class="flex items-center gap-1.5 mt-1">
                  <span class="text-xs px-2 py-0.5 rounded" style="background:rgba(124,140,248,0.12);border:1px solid rgba(124,140,248,0.22);color:${isDark()?'#96a2fa':'#3730a3'}">${esc(item.room)}</span>
                  <span class="text-xs" style="color:var(--c-t6)">${esc(item.group)}</span>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="mono font-bold tabular-nums grad-total num-col" style="font-size:15px">${fmt(item.lt)}</div>
                <div style="font-size:10px;color:var(--c-t4)">${sharePct}%</div>
              </div>
            </div>
            <div style="height:4px;border-radius:3px;background:var(--c-track);overflow:hidden;margin-top:10px">
              <div style="height:100%;width:${barPct}%;border-radius:3px;background:linear-gradient(90deg,#fb923c,#c2440a);box-shadow:0 0 10px rgba(234,88,12,${Math.max(0.2,0.55-i*0.07)})"></div>

  const divider=restItems.length?`<div class="flex items-center gap-3 px-4 py-4 mt-3">

  const restSection=restItems.length?restItems.slice(0,6).map(item=>`<div class="px-4 mb-2">
    <div class="flex items-center gap-3" style="background:var(--c-gc2);border:1px solid var(--c-bgc);border-radius:12px;padding:11px 14px;opacity:0.65">
      <span class="mono flex-shrink-0" style="font-size:13px;color:var(--c-t6);width:22px">${restItems.indexOf(item)+paretoItems.length+1}</span>
      <span class="flex-1 min-w-0 truncate" style="font-size:13.5px;color:var(--c-t2)">${esc(item.name)}</span>
      <span class="mono num-col" style="font-size:13.5px;color:var(--c-tq)">${fmt(item.lt)}</span>
    </div>
  </div>`).join(''):'';

  return`${header}${pareto}${itemRows}${divider}${restSection}<div style="height:40px"></div>`;
}

function renderComparisonResult(pA,pB){
  const totA=computeTotal(pA), totB=computeTotal(pB);
  const {pct:pctA}=progressStats(pA), {pct:pctB}=progressStats(pB);
  const netDelta=totB-totA;
  const absDelta=Math.abs(netDelta);
  const cheaper=netDelta<0?'B':'A';
  const diffPct=Math.max(totA,totB)>0?Math.round(absDelta/Math.max(totA,totB)*100):0;

  const secA=getSectionCosts(pA), secB=getSectionCosts(pB);
  const secDots={interior:'#5b9dff',systems:'#7c8cf8',exterior:'#38c4c4',kitchen:'#46c08a',bathroom:'#67cfc7',bedroom:'#a78bfa',living:'#d3a24e'};
  const sectionRows=Object.entries(ROOM_TYPES).map(([type,rt])=>{
    const sa=secA[type]?.total||0, sb=secB[type]?.total||0;
    if(!sa&&!sb)return'';
    const mx=Math.max(sa,sb,1);
    const wA=Math.round(sa/mx*100), wB=Math.round(sb/mx*100);
    const dot=secDots[type]||'#6b5535';
    return`<div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span style="width:7px;height:7px;border-radius:2px;background:${dot};flex-shrink:0"></span>
          <span style="font-size:13px;color:var(--c-t1b)">${rt.label}</span>
        </div>
        ${sa!==sb?`<span class="mono" style="font-size:11px;color:${sb>sa?'#fca5a5':'#6ee7b7'}">${sb>sa?'+':'−'}${fmt(Math.abs(sb-sa))}</span>`:''}
      </div>
      <div class="flex items-center gap-2 mb-1.5">
        <div class="flex-1 overflow-hidden" style="height:7px;border-radius:3px;background:var(--c-track)">
          <div style="height:100%;width:${wA}%;background:linear-gradient(90deg,#fb923c,#c2440a);border-radius:3px;box-shadow:0 0 8px rgba(234,88,12,0.35)"></div>
        </div>
        <span class="mono num-col flex-shrink-0" style="font-size:11.5px;color:var(--c-t1c);min-width:52px">${fmt(sa)}</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex-1 overflow-hidden" style="height:7px;border-radius:3px;background:var(--c-track)">
          <div style="height:100%;width:${wB}%;background:linear-gradient(90deg,#7db0ff,#4a7fc1);border-radius:3px;box-shadow:0 0 8px rgba(125,176,255,0.25)"></div>
        </div>
        <span class="mono num-col flex-shrink-0" style="font-size:11.5px;color:#7db0ff;min-width:52px">${fmt(sb)}</span>
      </div>
    </div>`;
  }).join('');

  const grpA=getGroupCosts(pA), grpB=getGroupCosts(pB);
  const allGKeys=[...new Set([...Object.keys(grpA),...Object.keys(grpB)])];
  const deltas=allGKeys.map(gKey=>{
    const a=grpA[gKey]?.total||0, b=grpB[gKey]?.total||0;
    const delta=b-a;
    const label=GROUPS[gKey]?.label||gKey;
    const ac=getAccent(gKey);
    return{gKey,label,a,b,delta,ac};
  }).filter(r=>r.a||r.b).sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta));
  const maxAbs=deltas.reduce((m,r)=>Math.max(m,Math.abs(r.delta)),1);

  const deltaRows=deltas.map(r=>{
    const isPos=r.delta>0;
    const isZero=r.delta===0;
    const pctBar=Math.round(Math.abs(r.delta)/maxAbs*100);
    const dotColor=isZero?'var(--c-bc)':isPos?'#fca5a5':'#6ee7b7';
    const deltaLabel=isZero?'same':((isPos?'+':'-')+fmt(Math.abs(r.delta)));
    const deltaColor=isZero?'var(--c-t6)':isPos?'#fca5a5':'#6ee7b7';
    return`<div style="border-bottom:1px solid var(--c-bd);padding:10px 0">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-2 min-w-0 flex-1">

        </div>
        <span class="mono font-bold flex-shrink-0" style="font-size:13px;color:${deltaColor}">${deltaLabel}</span>
      </div>
      <div class="flex items-center gap-2 mb-1">
        <div class="flex-1 overflow-hidden" style="height:6px;border-radius:3px;background:var(--c-track)">
          ${r.a?`<div style="height:100%;width:${Math.round(r.a/Math.max(r.a,r.b,1)*100)}%;background:linear-gradient(90deg,#fb923c,#c2440a);border-radius:3px"></div>`:''}</div>
        <span class="mono num-col" style="font-size:11px;color:var(--c-t2);min-width:52px">${r.a?fmt(r.a):'—'}</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex-1 overflow-hidden" style="height:6px;border-radius:3px;background:var(--c-track)">
          ${r.b?`<div style="height:100%;width:${Math.round(r.b/Math.max(r.a,r.b,1)*100)}%;background:linear-gradient(90deg,#7db0ff,#4a7fc1);border-radius:3px"></div>`:''}</div>
        <span class="mono num-col" style="font-size:11px;color:#7db0ff;min-width:52px">${r.b?fmt(r.b):'—'}</span>
      </div>
      ${!isZero?`<div style="margin-top:6px;height:3px;border-radius:2px;background:var(--c-bi);overflow:hidden">
        <div style="height:100%;width:${pctBar}%;background:${isPos?'linear-gradient(90deg,#fca5a5,#b91c1c)':'linear-gradient(90deg,#6ee7b7,#166534)'};border-radius:2px"></div>
      </div>`:''}
    </div>`;
  }).join('');

  const iconBtn=`display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--c-s3);border:1px solid var(--c-bw);color:var(--c-t2)`;
  return`<div class="sticky top-0 z-30 pt-safe" style="background:var(--c-head-bg);border-bottom:1px solid var(--c-bw);box-shadow:0 4px 24px var(--c-sh-h)">
    <div class="flex items-center px-4 gap-3" style="height:58px">
      <button data-action="compare-close" class="active:opacity-60 flex-shrink-0" style="${iconBtn}">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="flex-1 font-semibold px-1" style="font-size:15px;color:var(--c-t0)">Project Comparison</span>
      <button data-action="compare-reset" class="font-semibold active:opacity-70" style="font-size:12px;color:#7db0ff;min-height:44px;padding:0 8px">Reselect</button>
      <button data-action="toggle-theme" class="active:opacity-60 flex-shrink-0" style="${iconBtn}" title="Toggle theme">
        ${themeBtnSvg()}
      </button>
    </div>
  </div>

  <!-- A vs B total cards -->
  <div class="flex gap-3 px-4 pt-4 pb-1">
    <div class="flex-1 rounded-2xl p-3.5" style="background:radial-gradient(120% 130% at 0% 0%,rgba(249,115,22,0.10),rgba(0,0,0,0) 55%),linear-gradient(160deg,var(--c-s3),var(--c-s3));border:1px solid rgba(249,115,22,0.28);box-shadow:0 0 28px -10px rgba(234,88,12,0.25)">
      <div class="flex items-center gap-1.5 mb-2">
        <span style="width:7px;height:7px;border-radius:2px;background:#fb923c;display:inline-block;box-shadow:0 0 6px #fb923c"></span>
        <span style="font-size:10px;letter-spacing:0.13em;color:var(--c-t2);font-weight:600">PROJECT A</span>
      </div>
      <div class="font-semibold leading-snug truncate" style="font-size:13px;color:var(--c-t0)">${esc(pA.name)}</div>
      ${pA.address?`<div class="truncate" style="font-size:11px;color:var(--c-t6);margin-top:2px">${esc(pA.address)}</div>`:''}
      <div class="mono font-semibold tabular-nums grad-total" style="font-size:24px;margin-top:8px;line-height:1">${fmt(totA)}</div>
      <div class="mono" style="font-size:11px;color:var(--c-t4);margin-top:5px">${pctA}% reviewed</div>
    </div>
    <div class="flex-1 rounded-2xl p-3.5" style="background:radial-gradient(120% 130% at 100% 0%,rgba(125,176,255,0.09),rgba(0,0,0,0) 55%),linear-gradient(160deg,var(--c-gc1),var(--c-gc2));border:1px solid rgba(125,176,255,0.22)">
      <div class="flex items-center gap-1.5 mb-2">
        <span style="width:7px;height:7px;border-radius:2px;background:#7db0ff;display:inline-block;box-shadow:0 0 6px #7db0ff88"></span>
        <span style="font-size:10px;letter-spacing:0.13em;color:var(--c-t2);font-weight:600">PROJECT B</span>
      </div>
      <div class="font-semibold leading-snug truncate" style="font-size:13px;color:var(--c-t0)">${esc(pB.name)}</div>
      ${pB.address?`<div class="truncate" style="font-size:11px;color:var(--c-t6);margin-top:2px">${esc(pB.address)}</div>`:''}
      <div class="mono font-semibold tabular-nums" style="font-size:24px;margin-top:8px;line-height:1;background:linear-gradient(160deg,#c8dcff,#7db0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">${fmt(totB)}</div>
      <div class="mono" style="font-size:11px;color:var(--c-t4);margin-top:5px">${pctB}% reviewed</div>
    </div>
  </div>

  <!-- Net delta banner -->
  ${absDelta>0?`<div class="mx-4 my-3 flex items-center gap-3 rounded-xl py-3.5 px-4" style="background:${netDelta>0?'rgba(185,28,28,0.09)':'rgba(22,101,52,0.09)'};border:1px solid ${netDelta>0?'rgba(252,165,165,0.22)':'rgba(110,231,183,0.22)'}">
    <div style="width:28px;height:28px;border-radius:8px;background:${netDelta>0?'rgba(185,28,28,0.2)':'rgba(22,101,52,0.2)'};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${netDelta>0?'↑':'↓'}</div>

    </div>
  </div>`:`<div class="mx-4 my-3 rounded-xl py-3 px-4 text-center" style="background:var(--c-s2);border:1px solid var(--c-bw);font-size:13px;color:var(--c-t4)">Identical estimated cost</div>`}

  <!-- Cost by section -->
  <div class="px-4 pt-1 pb-4">
    <div class="flex items-center justify-between mb-3">
      <p class="text-xs font-semibold uppercase tracking-wider" style="color:var(--c-t4);letter-spacing:0.14em">Cost by Section</p>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5"><span style="width:7px;height:7px;border-radius:2px;background:#fb923c;display:inline-block"></span><span style="font-size:11px;color:var(--c-t4)">A</span></div>
        <div class="flex items-center gap-1.5"><span style="width:7px;height:7px;border-radius:2px;background:#7db0ff;display:inline-block"></span><span style="font-size:11px;color:var(--c-t4)">B</span></div>
      </div>
    </div>
    ${sectionRows}
  </div>

  <!-- Per-group delta breakdown -->
  ${deltas.length?`<div class="px-4 pt-2 pb-8" style="border-top:1px solid var(--c-bw)">
    <div class="flex items-center justify-between mb-1 pt-4">
      <p class="text-xs font-semibold uppercase tracking-wider" style="color:var(--c-t4);letter-spacing:0.14em">Group Delta Breakdown</p>

    </div>
    <div style="font-size:11px;color:var(--c-t6);margin-bottom:12px">Red = B costs more · Green = B costs less</div>
    ${deltaRows}
  </div>`:``}`;
}

function renderCompareView(){
  const list=loadList();
  if(list.length<2) return`<div class="flex flex-col items-center justify-center min-h-screen px-8 text-center" style="background:var(--c-welcome-bg)">
    <div class="flex items-center justify-center mb-5" style="width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,var(--c-s3),var(--c-s2));border:1px solid rgba(125,176,255,0.2);box-shadow:0 16px 40px -12px var(--c-sh-f)">
      <svg class="w-9 h-9" style="color:#7db0ff" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
    </div>
    <h2 class="font-bold text-lg mb-2" style="color:var(--c-t0)">Need 2 projects to compare</h2>
    <p class="text-sm mb-8 max-w-xs leading-relaxed" style="color:var(--c-t4)">You only have ${list.length} project saved. Create another estimate first, then come back to compare.</p>
    <button data-action="compare-close" class="px-6 py-3 text-white font-semibold rounded-xl text-sm active:opacity-80" style="background:linear-gradient(160deg,#f97316,#c2440a);box-shadow:0 10px 28px -8px rgba(194,68,10,0.6)">← Back to Project</button>
  </div>`;
  if(!cmpState.a) return renderComparePicker('a');
  if(!cmpState.b) return renderComparePicker('b');
  const pA=loadProj(cmpState.a), pB=loadProj(cmpState.b);
  if(!pA||!pB){cmpState={a:null,b:null};return renderCompareView();}
  return renderComparisonResult(pA,pB);
}

          + Start New Project
        </button>
        ${list.length>0?`<button data-open-side class="mt-5 font-medium text-sm py-2" style="color:#fb923c">
          View ${list.length} existing project${list.length!==1?'s':''} →
        </button>`:''}
      </div>
    </div>
  `;
}

function render(){
  const app=document.getElementById('app');
  if(!proj)                      app.innerHTML=renderWelcome();
  else if(viewMode==='triage')   app.innerHTML=renderTriageView();
  else if(viewMode==='compare')  app.innerHTML=renderCompareView();
  else                           app.innerHTML=renderProject();
  refreshPanelList();
}

function refreshPanelList(){
  const list=loadList();
  document.getElementById('panel-list').innerHTML=list.length===0
    ?`<p class="text-sm text-center py-8 px-4" style="color:var(--c-t6)">No projects yet</p>`
    :list.map(p=>{
      const isActive=proj&&p.id===proj.id;
      return`<button class="w-full text-left px-4 py-3.5 active:opacity-70 ${isActive?'border-l-[3px]':''}"
        style="${isActive?'background:rgba(91,157,255,0.08);border-color:#5b9dff;box-shadow:inset 3px 0 0 #5b9dff':'border-bottom:1px solid var(--c-bd)'}"
        data-switch="${p.id}">
        <div class="font-semibold text-sm truncate" style="color:${isActive?'var(--c-t0)':'var(--c-t1d)'}">${esc(p.name)}</div>
        ${p.address?`<div class="truncate mt-0.5" style="font-size:11px;color:var(--c-t6)">${esc(p.address)}</div>`:''}
        <div class="mt-0.5 mono" style="font-size:11px;color:var(--c-t6)">${new Date(p.updatedAt).toLocaleDateString()}</div>
      </button>`;
    }).join('');
}

// ═══════════════════════════════════════════════════════════════════════════
// PANEL HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function openPanel(){refreshPanelList();document.getElementById('panel-overlay').classList.remove('hidden');document.getElementById('side-panel').style.transform='translateX(0)'}
function closePanel(){document.getElementById('panel-overlay').classList.add('hidden');document.getElementById('side-panel').style.transform=''}

// ═══════════════════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════════════
function setupListeners(){
  document.getElementById('close-panel').addEventListener('click',closePanel);
  document.getElementById('panel-overlay').addEventListener('click',closePanel);
  document.getElementById('panel-new').addEventListener('click',()=>{closePanel();openModal('new-proj')});
  document.getElementById('compare-btn').addEventListener('click',()=>{
    closePanel();cmpState={a:null,b:null};viewMode='compare';render();
  });

  document.body.addEventListener('click',e=>{
    if(e.target.matches('#modal-bg')||e.target.closest('[data-modal-cancel]')){closeModal();return}
    if(e.target.closest('[data-modal-confirm]')){confirmModal();return}

    const noAction=e.target.closest('[data-noaction]');
    if(noAction){e.stopImmediatePropagation();handleNoAction(noAction.dataset.room,noAction.dataset.gkey);return}

    const collapse=e.target.closest('[data-collapse]');
    if(collapse){handleToggleCollapse(collapse.dataset.room,collapse.dataset.gkey);return}

    if(e.target.closest('[data-open-side]')){openPanel();return}
    if(e.target.closest('[data-open-modal]')){openModal('new-proj');return}

    const sw=e.target.closest('[data-switch]');
    if(sw){const p=loadProj(sw.dataset.switch);if(p){proj=p;setActiveId(p.id);closePanel();render()}return}

    if(e.target.closest('[data-action="rename-proj"]')){openModal('rename-proj');return}
    if(e.target.closest('[data-action="open-settings"]')){openModal('settings');return}
    if(e.target.closest('[data-action="export"]')){exportProject();return}
    if(e.target.closest('[data-action="open-triage"]')){viewMode='triage';render();return}
    if(e.target.closest('[data-action="back-to-project"]')){viewMode='project';render();return}
    if(e.target.closest('[data-action="compare-close"]')){viewMode='project';render();return}
    if(e.target.closest('[data-action="compare-reset"]')){cmpState={a:null,b:null};render();return}
    if(e.target.closest('[data-action="toggle-theme"]')){toggleTheme();return}

    const cmpPick=e.target.closest('[data-cmp-pick]');
    if(cmpPick){
      const[slot,id]=cmpPick.dataset.cmpPick.split('|');
      if(slot==='a'){cmpState.a=id;}else{cmpState.b=id;}
      render();return;
    }

    const rp=e.target.closest('[data-remove-photo]');
    if(rp){removePhoto(rp.dataset.removePhoto);return}

    const esn=e.target.closest('[data-edit-sn]');
    if(esn&&!e.target.matches('input')){startSNEdit(esn.dataset.editSn,esn);return}

    const ep=e.target.closest('[data-editprice]');
    if(ep){startPriceEdit(ep.dataset.room,ep.dataset.gkey,ep.dataset.item,ep);return}

    if(e.target.id==='reset-prices-btn'){
      setGlobalPrices({});closeModal();
      showToast('Prices reset to defaults');render();return;
    }
    if(e.target.id==='dl-prices-btn'){
      const csv=buildPriceCsv();
      const a=document.createElement('a');
      a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
      a.download='spark-prices.csv';a.click();return;
    }

    const addRoom_=e.target.closest('[data-add-room]');
    if(addRoom_){addRoom(addRoom_.dataset.addRoom);return}

    const renameRoom_=e.target.closest('[data-rename-room]');
    if(renameRoom_){openModal('rename-room',{roomId:renameRoom_.dataset.renameRoom});return}

    const removeRoom_=e.target.closest('[data-remove-room]');
    if(removeRoom_){openModal('remove-room',{roomId:removeRoom_.dataset.removeRoom});return}

    // Click-based checkbox (div with data-checkbox)
    const cbDiv=e.target.closest('[data-checkbox]');
    if(cbDiv&&cbDiv.tagName!=='INPUT'){
      const room=proj.rooms.find(r=>r.id===cbDiv.dataset.room);
      const item=room?.groups[cbDiv.dataset.gkey]?.items[cbDiv.dataset.item];
      if(item){handleCheck(cbDiv.dataset.room,cbDiv.dataset.gkey,cbDiv.dataset.item,!item.checked);}
      return;
    }

    // Qty stepper buttons
    const qdec=e.target.closest('[data-qty-dec]');
    if(qdec){
      const inp=document.getElementById(`qty-${qdec.dataset.room}-${qdec.dataset.gkey}-${qdec.dataset.item}`);
      const cur=parseFloat(inp?.value)||0;
      const nv=Math.max(0,cur-1);
      if(inp){inp.value=nv||'';handleQtyInput(qdec.dataset.room,qdec.dataset.gkey,qdec.dataset.item,String(nv));}
      return;
    }
    const qinc=e.target.closest('[data-qty-inc]');
    if(qinc){
      const inp=document.getElementById(`qty-${qinc.dataset.room}-${qinc.dataset.gkey}-${qinc.dataset.item}`);
      const cur=parseFloat(inp?.value)||0;
      const nv=cur+1;
      if(inp){inp.value=nv;handleQtyInput(qinc.dataset.room,qinc.dataset.gkey,qinc.dataset.item,String(nv));}
      return;
    }
  });

  document.body.addEventListener('change',e=>{
    const cb=e.target;
    if(cb.tagName==='INPUT'&&cb.dataset.checkbox!==undefined)handleCheck(cb.dataset.room,cb.dataset.gkey,cb.dataset.item,cb.checked);
    if(cb.matches('[data-photo-input]')&&cb.files?.[0]){
      handlePhotoFile(cb.files[0]);
      cb.value='';
      return;
    }
    if(cb.matches('[data-room-photo-input]')&&cb.files?.[0]){
      handlePhotoFile(cb.files[0],cb.dataset.roomPhotoInput);
      cb.value='';
      return;
    }
    if(cb.id==='price-csv-input'&&cb.files?.[0]){
      const reader=new FileReader();
      reader.onload=ev=>{
        const prices=parseGlobalPriceCsv(ev.target.result);
        const n=Object.keys(prices).length;
        if(!n){showToast('No matching IDs found in CSV');return;}
        setGlobalPrices(prices);
        closeModal();
        showToast(`Updated ${n} item price${n!==1?'s':''} globally`);
        render();
      };
      reader.readAsText(cb.files[0]);
    }
  });

  document.body.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.qty!==undefined)handleQtyInput(el.dataset.room,el.dataset.gkey,el.dataset.item,el.value);
  });

  document.body.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&modalSt&&!document.getElementById('modal').classList.contains('hidden')){
      e.preventDefault();confirmModal();
    }
    if(e.key==='Escape'&&modalSt)closeModal();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
function init(){
  initTheme();
  const id=getActiveId();
  if(id)proj=loadProj(id);
  if(!proj){
    const list=loadList();
    if(list.length>0){proj=loadProj(list[0].id);if(proj)setActiveId(proj.id)}
  }
  setupListeners();
  render();
}

init();
</script>
